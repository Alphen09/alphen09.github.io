<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alberto NFT Marketplace</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #0a0a0a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
    }

    .logo {
      font-size: 70px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #cccccc;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .login-card {
      background: #1a1a1a;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(111, 66, 193, 0.3);
      border-radius: 20px;
    }

    .btn {
      background: #6f42c1;
      color: white;
      border: none;
      padding: 16px 35px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn:hover {
      background: #8055d6;
    }

    #userInfo {
      margin-top: 20px;
      font-size: 18px;
      color: #dddddd;
    }

    .status {
      margin-top: 25px;
      color: #aaaaaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

<div class="logo">🐉</div>

<h1>Alberto NFT Marketplace</h1>

<p class="subtitle">
Discover • Collect • Mint • Trade Legendary NFTs
</p>

<div class="login-card">

<h2>Welcome to Alberto NFT Marketplace</h2>

<p>
Login with your Pi account to enter the marketplace.
</p>

<button class="btn" id="loginBtn">
Login with Pi
</button>

<div id="userInfo"></div>

<div class="status">
Pi Network Sandbox Testing
</div>

</div>

</div>

<script>

Pi.init({
    version: "2.0",
    sandbox: true
});

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async () => {

    try {

        loginBtn.disabled = true;
        loginBtn.innerText = "Connecting to Pi...";

        const auth = await Pi.authenticate(
            ["username", "payments"],
            onIncompletePaymentFound
        );

        document.getElementById("userInfo").innerHTML =
            "👤 Welcome, " + auth.user.username;

        localStorage.setItem(
            "piUser",
            auth.user.username
        );

        setTimeout(() => {

            window.location.href = "marketplace.html";

        }, 1000);

    } catch (error) {

        console.error(error);

        alert("Pi Login Failed.");

        loginBtn.disabled = false;
        loginBtn.innerText = "Login with Pi";

    }

});

function onIncompletePaymentFound(payment) {

    console.log("Incomplete Payment:", payment);

}

</script>

</body>
</html>
