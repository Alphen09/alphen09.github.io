<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Alberto NFT Marketplace</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #241044 0%, #0b0710 45%, #050505 100%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 650px;
    padding: 30px 20px;
}

/* =========================
   LOGO
========================= */

.logo-box {
    width: 180px;
    height: 180px;
    margin: 0 auto 25px;

    border-radius: 50%;

    background:
        radial-gradient(circle, #241044, #0b0710);

    border: 2px solid rgba(180, 130, 255, 0.7);

    box-shadow:
        0 0 20px rgba(140, 70, 255, 0.5),
        0 0 60px rgba(100, 40, 200, 0.25);

    display: flex;
    align-items: center;
    justify-content: center;

    animation: glow 3s infinite alternate;
}

.logo {
    width: 135px;
    height: 135px;
    object-fit: contain;
    border-radius: 50%;
}

@keyframes glow {

    from {
        box-shadow:
            0 0 15px rgba(140,70,255,0.4);
    }

    to {
        box-shadow:
            0 0 35px rgba(170,100,255,0.8),
            0 0 80px rgba(100,40,200,0.35);
    }

}

/* =========================
   TITLE
========================= */

h1 {
    margin: 0;

    font-size: 38px;

    letter-spacing: 1px;

    text-shadow:
        0 0 15px rgba(170,100,255,0.5);
}

.subtitle {

    color: #cfcfcf;

    font-size: 16px;

    margin:
        12px 0 35px;

    line-height: 1.6;
}

/* =========================
   CARD
========================= */

.login-card {

    background:
        rgba(20, 15, 28, 0.92);

    border:
        1px solid rgba(150,100,220,0.35);

    border-radius: 24px;

    padding: 35px 25px;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.5);

    backdrop-filter: blur(10px);
}

.login-card h2 {

    margin-top: 0;

    font-size: 24px;
}

.login-card p {

    color: #bdbdbd;

    line-height: 1.5;
}

/* =========================
   BUTTONS
========================= */

.btn {

    width: 100%;

    max-width: 360px;

    border: none;

    padding: 16px;

    border-radius: 14px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 15px;

    transition: 0.2s;
}

.signup-btn {

    background:
        linear-gradient(
            135deg,
            #6f42c1,
            #9b63e8
        );

    color: white;

    box-shadow:
        0 8px 25px rgba(111,66,193,0.35);
}

.login-btn {

    background:
        transparent;

    color: white;

    border:
        1px solid #8c5bd1;
}

.btn:hover {

    transform: translateY(-2px);
}

.btn:disabled {

    opacity: 0.6;

    cursor: wait;

    transform: none;
}

/* =========================
   USER
========================= */

#userInfo {

    margin-top: 20px;

    color: #e0d0ff;

    font-size: 16px;
}

.status {

    margin-top: 25px;

    color: #777;

    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .logo-box {
        width: 145px;
        height: 145px;
    }

    .logo {
        width: 110px;
        height: 110px;
    }

    h1 {
        font-size: 29px;
    }

    .subtitle {
        font-size: 14px;
    }

    .login-card {
        padding: 28px 18px;
    }

}

</style>

</head>


<body>

<div class="container">

    <!-- =========================
         ALBERTO LOGO
    ========================== -->

    <div class="logo-box">
<img src="alberto nft marketplace.png" alt="Alberto NFT Marketplace Logo" class="logo">
    </div>


    <!-- =========================
         TITLE
    ========================== -->

    <h1>
        Alberto NFT Marketplace
    </h1>

    <p class="subtitle">
        Discover • Collect • Mint • Trade
        <br>
        Legendary Digital Assets
    </p>


    <!-- =========================
         LOGIN CARD
    ========================== -->

    <div class="login-card">

        <h2>
            Welcome
        </h2>

        <p>
            Enter the Alberto NFT Marketplace
            using your Pi account.
        </p>


        <!-- SIGN UP -->

        <button
            class="btn signup-btn"
            id="signupBtn"
            type="button"
        >
            ✨ Sign Up with Pi
        </button>


        <!-- LOGIN -->

        <button
            class="btn login-btn"
            id="loginBtn"
            type="button"
        >
            🔐 Log In with Pi
        </button>


        <div id="userInfo"></div>


        <div class="status">
            Pi Network Sandbox • Alberto NFT Marketplace
        </div>

    </div>

</div>


<script>

/* =========================
   PI INITIALIZATION
========================= */

Pi.init({

    version: "2.0",

    sandbox: true

});


/* =========================
   BUTTONS
========================= */

const signupBtn =
    document.getElementById("signupBtn");

const loginBtn =
    document.getElementById("loginBtn");

const userInfo =
    document.getElementById("userInfo");


/* =========================
   SIGN UP
========================= */

signupBtn.addEventListener(
    "click",
    function () {

        authenticatePi("signup");

    }
);


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    function () {

        authenticatePi("login");

    }
);


/* =========================
   PI AUTHENTICATION
========================= */

async function authenticatePi(mode) {

    try {

        signupBtn.disabled = true;

        loginBtn.disabled = true;

        signupBtn.innerText =
            "Connecting to Pi...";

        loginBtn.innerText =
            "Connecting to Pi...";


        const auth =
            await Pi.authenticate(

                ["username", "payments"],

                onIncompletePaymentFound

            );


        /* =========================
           SAVE USER
        ========================== */

        const username =
            auth.user.username;


        localStorage.setItem(
            "piUser",
            username
        );


        userInfo.innerHTML =
            "👤 Welcome, <b>" +
            username +
            "</b>";


        signupBtn.innerText =
            "✓ Pi Account Connected";

        loginBtn.innerText =
            "✓ Login Successful";


        /* =========================
           ENTER MARKETPLACE
        ========================== */

        setTimeout(
            function () {

                window.location.href =
                    "marketplace.html";

            },
            1000
        );


    } catch (error) {

        console.error(
            "Pi Authentication Error:",
            error
        );


        alert(
            "Pi Login Failed.\n\n" +
            (
                error &&
                error.message
                    ? error.message
                    : String(error)
            )
        );


        signupBtn.disabled = false;

        loginBtn.disabled = false;


        signupBtn.innerText =
            "✨ Sign Up with Pi";

        loginBtn.innerText =
            "🔐 Log In with Pi";

    }

}


/* =========================
   INCOMPLETE PAYMENT
========================= */

function onIncompletePaymentFound(payment) {

    console.log(
        "Incomplete Payment Found:",
        payment
    );

}

</script>

</body>

</html>
