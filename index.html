
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alberto Pet Marketplace</title>
    <!-- Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        /* Basic Styling - I-adjust mo na lang ayon sa gusto mong design */
        body { font-family: sans-serif; padding: 20px; }
        #pi-user { font-weight: bold; margin-bottom: 20px; color: #5c3b88; }
        .card { border: 1px solid #ccc; padding: 15px; margin: 10px; display: inline-block; width: 200px; text-align: center; }
        .nft-image img { width: 100px; height: 100px; }
        .category.active { background: #5c3b88; color: white; }
        #petModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="pi-user">Logging in to Pi...</div>

    <!-- Search at Filters -->
    <input type="text" id="searchNFT" placeholder="Search pets...">
    <div>
        <button class="category" data-category="all">All</button>
        <!-- Magdagdag ka pa ng buttons dito base sa categories mo -->
    </div>

    <!-- Container kung saan lalabas ang mga pets -->
    <div id="pet-container">
        <!-- Halimbawa ng Card (Dapat ganito ang structure na hinahanap ng app.js) -->
        <div class="card" data-category="mythic">
            <div class="nft-image"><img src="inferno-dragon.png" alt="Inferno Dragon"></div>
            <h2>Inferno Dragon</h2>
            <button class="buy-btn" data-nft="Inferno Dragon" data-price="50">Buy with Pi</button>
        </div>
    </div>

    <!-- Modal for Pet Details -->
    <div id="petModal">
        <div class="modal-content">
            <span id="closePet" style="cursor:pointer; float:right;">&times;</span>
            <img id="petModalImage" src="" alt="Pet">
            <h2 id="petModalName"></h2>
            <p>Rarity: <span id="petModalRarity"></span></p>
            <p>HP: <span id="petHP"></span></p>
            <p>Ability: <span id="petAbility"></span></p>
        </div>
    </div>

    <!-- I-link ang iyong logic file -->
    <script src="app.js"></script>
</body>
</html>
