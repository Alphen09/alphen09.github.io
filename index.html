<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alberto Pet Marketplace</title>
    <!-- Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        #pi-user { font-size: 1.2rem; color: #5c3b88; margin-bottom: 20px; }
        
        /* Marketplace Grid */
        #pet-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: white; border-radius: 15px; padding: 15px; width: 220px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .nft-image img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; }
        
        /* Modal Styling */
        #petModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; position: relative; }
        #closePet { position: absolute; top: 10px; right: 20px; font-size: 24px; cursor: pointer; }
        .stats { text-align: left; margin-top: 15px; }
    </style>
</head>
<body>

    <h1 id="pi-user">Loading Pi...</h1>

    <input type="text" id="searchNFT" placeholder="Search pets..." style="padding: 10px; width: 80%; max-width: 400px; margin-bottom: 20px;">

    <div id="pet-container">
        <!-- Ang mga cards ay automatic na lalabas dito base sa script mo -->
    </div>

    <!-- Pet Details Modal -->
    <div id="petModal" aria-hidden="true">
        <div class="modal-content">
            <span id="closePet">&times;</span>
            <img id="petModalImage" src="" alt="Pet" style="width: 150px; height: 150px;">
            <h2 id="petModalName"></h2>
            <p>Rarity: <strong id="petModalRarity"></strong></p>
            <div class="stats">
                <p>❤️ HP: <span id="petHP"></span></p>
                <p>⚔️ Attack: <span id="petAttack"></span></p>
                <p>🛡️ Defense: <span id="petDefense"></span></p>
                <p>⚡ Speed: <span id="petSpeed"></span></p>
                <p>✨ Ability: <span id="petAbility"></span></p>
            </div>
        </div>
    </div>

    <!-- I-link ang iyong logic -->
    <script src="app.js"></script>
    
    <!-- Script para i-generate ang cards base sa PET_DATA mo -->
    <script>
        window.addEventListener('load', () => {
            const container = document.getElementById('pet-container');
            const data = AlbertoPets.getAllPetData();
            
            Object.keys(data).forEach(name => {
                const pet = data[name];
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="nft-image"><img src="${pet.image}" alt="${name}"></div>
                    <h2>${name}</h2>
                    <p>${pet.rarity}</p>
                    <button class="buy-btn" data-nft="${name}" data-price="${pet.price}">Buy for ${pet.price} Pi</button>
                `;
                container.appendChild(card);
            });
            
            // Re-initialize listeners after generating HTML
            // (Tawagin ang functions mula sa app.js mo)
            if (typeof initializeMarketplace === 'function') {
                initializeMarketplace();
            }
        });
    </script>
</body>
</html>
