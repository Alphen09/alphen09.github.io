<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alberto NFT Marketplace</title>

<link rel="stylesheet" href="marketplace.css">

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

</head>

<body>

<header class="header">

<h1>
<img src="images/logo.png" class="logo" alt="Alberto Logo">
Alberto NFT Marketplace
</h1>

<div id="pi-user"></div>

<input
id="searchNFT"
class="search"
type="text"
placeholder="Search NFTs...">

</header>

<main class="market-grid">

<div class="card">

<img src="satoshi-devil-wing.jpg" alt="Satoshi Devil Wings">

<h2>Satoshi Devil Wings +30</h2>

<p class="collection">Collection: Satoshi Wings</p>

<p class="price">500 Pi</p>

<button
class="buy-btn"
onclick="buy(500,'wing001','Satoshi Devil Wings +30')">

Buy with Pi

</button>

</div>

<div class="card">

<img src="images/archangel.jpg" alt="Satoshi Archangel Wings">

<h2>Satoshi Archangel Wings +30</h2>

<p class="collection">Collection: Satoshi Wings</p>

<p class="price">800 Pi</p>

<button
class="buy-btn"
onclick="buy(800,'wing002','Satoshi Archangel Wings +30')">

Buy with Pi

</button>

</div>
<div class="card">

<img src="satoshi-dark-angel-wing.jpg" alt="Satoshi Dark Angel Wings">

<h2>Satoshi Dark Angel Wings +30</h2>

<p class="collection">Collection: Satoshi Wings</p>

<p class="price">1200 Pi</p>

<button
class="buy-btn"
onclick="buy(1200,'wing003','Satoshi Dark Angel Wings +30')">

Buy with Pi

</button>

</div>

<div class="card">

<img src="satoshi-astral-bike-rw3.jpg" alt="Satoshi Astral Bike RW3">

<h2>Satoshi Astral Bike RW3</h2>

<p class="collection">Collection: RW3 Mounts</p>

<p class="price">2000 Pi</p>

<button
class="buy-btn"
onclick="buy(2000,'bike001','Satoshi Astral Bike RW3')">

Buy with Pi

</button>

</div>

</main>

<script src="marketplace.js"></script>

</body>

</html>
