<!DOCTYPE html>
<html>
<head>
  <title>PetVerse NFT Marketplace</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body{background:#1a1a2e;color:gold;font-family:Arial;padding:20px;text-align:center}
    .item{border:2px solid purple;margin:20px;padding:20px;border-radius:15px}
    button{background:gold;color:#1a1a2e;border:none;padding:12px 25px;border-radius:10px;font-weight:bold;cursor:pointer}
    #status{margin-top:20px;font-size:18px}
  </style>
</head>
<body>
  <h1>PetVerse NFT Marketplace [TEST MODE]</h1>
  
  <div class="item"><h2>Devil Wing</h2><p>Price: 10 Test π</p><button onclick="buyItem('Devil Wing', 10)">Buy with Pi</button></div>
  <div class="item"><h2>Dark Angel Wing</h2><p>Price: 15 Test π</p><button onclick="buyItem('Dark Angel Wing', 15)">Buy with Pi</button></div>
  <div class="item"><h2>Astral Bike</h2><p>Price: 25 Test π</p><button onclick="buyItem('Astral Bike', 25)">Buy with Pi</button></div>
  
  <div id="status"></div>

<script>
Pi.init({ version: "2.0", sandbox: true }); // TEST PI LANG TO

function buyItem(itemName, amount) {
  document.getElementById("status").innerHTML = "Opening Pi Wallet...";
  const paymentData = {amount: amount, memo: "TEST Buy " + itemName, metadata: { item: itemName }};
  const callbacks = {
    onReadyForServerApproval: function(paymentId) {
      document.getElementById("status").innerHTML = "Approving payment...";
      Pi.completePayment(paymentId); // DITO NAAAYOS YUNG 60s EXPIRED
    },
    onReadyForServerCompletion: function(paymentId, txid) {
      document.getElementById("status").innerHTML = "✅ TEST SUCCESS! " + itemName + " is yours!";
    },
    onCancel: function(paymentId) { document.getElementById("status").innerHTML = "❌ Payment Cancelled"; },
    onError: function(error) { document.getElementById("status").innerHTML = "Error: " + error; }
  };
  Pi.createPayment(paymentData, callbacks);
}
</script>
</body>
</html>
