<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alberto NFT Marketplace - Profile</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #35145f 0%, #1a0b31 40%, #09050f 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

.topbar {
    width: 100%;
    min-height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(7,4,13,.96);
    border-bottom: 1px solid rgba(150,90,230,.25);
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
}

.back-btn,
.action-btn {
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(170,100,255,.45);
    background: rgba(25,12,43,.9);
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.brand {
    text-align: center;
    font-weight: bold;
    font-size: 18px;
}

.brand span {
    display: block;
    margin-top: 3px;
    color: #9d8fae;
    font-size: 11px;
    font-weight: normal;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 35px 18px 70px;
}

.profile-hero {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 45px 25px 35px;
    border-radius: 26px;
    background: linear-gradient(145deg, rgba(43,22,68,.98), rgba(11,7,18,.98));
    border: 1px solid rgba(170,100,255,.35);
    box-shadow: 0 20px 55px rgba(0,0,0,.45);
}

.avatar {
    width: 125px;
    height: 125px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(190,120,255,.8);
    background: #10091a;
    box-shadow: 0 0 25px rgba(130,60,230,.55);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.profile-picture-area {
    margin-bottom: 18px;
}

.profile-picture-label {
    display: inline-block;
    padding: 10px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg,#7138c8,#a653f0);
    color: white;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

#profilePictureInput {
    display: none;
}

.profile-picture-status {
    margin-top: 8px;
    min-height: 16px;
    color: #8f829d;
    font-size: 11px;
}

.profile-hero h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.username {
    color: #c99bff;
    font-size: 16px;
    margin-bottom: 8px;
}

.member {
    color: #777080;
    font-size: 12px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
    margin-top: 28px;
}

.stat {
    padding: 18px 10px;
    border-radius: 15px;
    background: rgba(9,5,15,.75);
    border: 1px solid rgba(150,90,220,.22);
}

.stat strong {
    display: block;
    color: #e0c5ff;
    font-size: 22px;
    margin-bottom: 6px;
}

.stat span {
    color: #8d8495;
    font-size: 11px;
}

.collection-section {
    margin-top: 35px;
}

.collection-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 18px;
}

.collection-header h2 {
    font-size: 27px;
    margin-bottom: 5px;
}

.collection-header p {
    color: #948b9d;
    font-size: 13px;
}

.collection-count {
    color: #c49aff;
    font-size: 13px;
}

.buttons {
    text-align: center;
    margin-bottom: 22px;
}

.mint-btn {
    padding: 13px 22px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg,#7138c8,#a653f0);
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 20px rgba(115,50,210,.3);
}

.nft-grid {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 15px;
}

.nft-card {
    overflow: hidden;
    border-radius: 17px;
    background: linear-gradient(180deg,rgba(28,18,40,.98),rgba(11,7,16,.98));
    border: 1px solid rgba(145,85,215,.25);
    box-shadow: 0 10px 28px rgba(0,0,0,.3);
}

.nft-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #08050c;
    overflow: hidden;
}

.nft-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.nft-info {
    padding: 13px;
}

.nft-type {
    color: #a66ee0;
    font-size: 9px;
    font-weight: bold;
    margin-bottom: 6px;
    text-transform: uppercase;
}

.nft-info h3 {
    font-size: 15px;
    line-height: 1.3;
    margin-bottom: 8px;
}

.nft-meta {
    display: grid;
    gap: 5px;
    color: #91879b;
    font-size: 10px;
}

.nft-meta strong {
    color: #d5b4ff;
}

.nft-price {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid rgba(150,90,220,.15);
    color: #c99bff;
    font-size: 13px;
    font-weight: bold;
}

.nft-status {
    margin-top: 6px;
    color: #8e8497;
    font-size: 9px;
}

.empty {
    grid-column: 1 / -1;
    padding: 45px 20px;
    text-align: center;
    border-radius: 18px;
    background: rgba(15,9,24,.65);
    border: 1px dashed rgba(150,90,220,.3);
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.empty h3 {
    font-size: 19px;
    margin-bottom: 8px;
}

.empty p {
    color: #837a8c;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 20px;
}

.market-btn {
    display: inline-block;
    padding: 13px 22px;
    border-radius: 13px;
    border: none;
    background: linear-gradient(135deg,#7138c8,#a653f0);
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.footer {
    text-align: center;
    padding: 30px 15px;
    color: #77717d;
    font-size: 11px;
    border-top: 1px solid rgba(130,75,190,.2);
}

.footer strong {
    display: block;
    color: #bca0d5;
    font-size: 14px;
    margin-bottom: 6px;
}

@media (max-width:600px) {
    .topbar {
        min-height: 70px;
        padding: 9px 10px;
    }

    .back-btn {
        padding: 9px 10px;
        font-size: 11px;
    }

    .brand {
        font-size: 15px;
    }

    .container {
        padding: 22px 12px 45px;
    }

    .profile-hero {
        padding: 35px 16px 25px;
    }

    .avatar {
        width: 105px;
        height: 105px;
    }

    .profile-hero h1 {
        font-size: 25px;
    }

    .stats {
        gap: 7px;
    }

    .stat {
        padding: 14px 5px;
    }

    .stat strong {
        font-size: 18px;
    }

    .stat span {
        font-size: 9px;
    }

    .collection-header h2 {
        font-size: 23px;
    }

    .nft-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
        gap: 10px;
    }

    .nft-info {
        padding: 9px;
    }

    .nft-info h3 {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <button class="back-btn" onclick="goMarketplace()">
        ← Marketplace
    </button>

    <div class="brand">
        Alberto NFT
        <span>Collector Profile</span>
    </div>

    <div style="width:88px;"></div>

</header>


<main class="container">

<section class="profile-hero">

    <div class="avatar">
        <img
            id="profileImage"
            src="alberto%20nft%20marketplace.jpg"
            alt="Profile Picture"
        >
    </div>

    <div class="profile-picture-area">

        <label
            class="profile-picture-label"
            for="profilePictureInput"
        >
            📸 Change Profile Picture
        </label>

        <input
            type="file"
            id="profilePictureInput"
            accept="image/png,image/jpeg,image/webp"
        >

        <div
            class="profile-picture-status"
            id="profilePictureStatus"
        >
            Loading profile...
        </div>

    </div>

    <h1>Alberto Collector</h1>

    <div
        class="username"
        id="username"
    >
        Loading Pi username...
    </div>

    <div class="member">
        Pi Network Collector
    </div>


    <div class="stats">

        <div class="stat">
            <strong id="ownedCount">0</strong>
            <span>NFTs Owned</span>
        </div>

        <div class="stat">
            <strong id="mintedCount">0</strong>
            <span>NFTs Minted</span>
        </div>

        <div class="stat">
            <strong id="volumeCount">0 Pi</strong>
            <span>Collection Volume</span>
        </div>

    </div>

</section>


<section class="collection-section">

    <div class="collection-header">

        <div>
            <h2>My Collection</h2>
            <p>Your Alberto digital assets</p>
        </div>

        <span
            class="collection-count"
            id="collectionCount"
        >
            0 Items
        </span>

    </div>


    <div class="buttons">

        <button
            class="mint-btn"
            onclick="goMint()"
        >
            🎨 Mint New NFT
        </button>

    </div>


    <div
        class="nft-grid"
        id="nftGrid"
    ></div>

</section>

</main>


<footer class="footer">

    <strong>
        Alberto NFT Marketplace
    </strong>

    © 2026 Alberto Digital Art Work Studio

</footer>


<script>

/* =========================================================
   PI USER
========================================================= */

const savedUser =
    localStorage.getItem("piUser");

const username =
    document.getElementById("username");

if (savedUser) {

    username.textContent =
        "👤 @" + savedUser;

} else {

    username.textContent =
        "👤 Pi account not connected";

}


/* =========================================================
   NAVIGATION
========================================================= */

function goMarketplace() {

    window.location.href =
        "marketplace.html";

}

function goMint() {

    window.location.href =
        "mint.html";

}


/* =========================================================
   NFT COLLECTION
========================================================= */

function loadNFTCollection() {

    const nftGrid =
        document.getElementById("nftGrid");

    let allNFTs = [];

    try {

        const saved =
            localStorage.getItem("myCollection");

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (Array.isArray(parsed)) {

                allNFTs = parsed;

            }

        }

    } catch (error) {

        console.error(
            "Collection loading error:",
            error
        );

    }


    /* -----------------------------------------------
       ONLY CURRENT USER'S NFTS
    ------------------------------------------------ */

    let userNFTs =
        allNFTs.filter(function(nft) {

            return (
                nft &&
                nft.owner === savedUser
            );

        });


    /* -----------------------------------------------
       STATS
    ------------------------------------------------ */

    document.getElementById("ownedCount")
        .textContent =
        userNFTs.length;

    document.getElementById("mintedCount")
        .textContent =
        userNFTs.filter(function(nft) {

            return (
                nft.creator === savedUser
            );

        }).length;


    const totalVolume =
        userNFTs.reduce(
            function(total,nft) {

                return total +
                    (Number(nft.price) || 0);

            },
            0
        );


    document.getElementById("volumeCount")
        .textContent =
        totalVolume.toFixed(2) + " Pi";


    document.getElementById("collectionCount")
        .textContent =
        userNFTs.length +
        (
            userNFTs.length === 1
                ? " Item"
                : " Items"
        );


    /* -----------------------------------------------
       EMPTY
    ------------------------------------------------ */

    if (userNFTs.length === 0) {

        nftGrid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    💎
                </div>

                <h3>
                    Your collection is empty
                </h3>

                <p>
                    NFTs that you purchase or mint
                    will appear here.
                </p>

                <button
                    class="market-btn"
                    onclick="goMarketplace()"
                >
                    Explore Marketplace
                </button>

            </div>

        `;

        return;
    }


    /* -----------------------------------------------
       NFT CARDS
    ------------------------------------------------ */

    nftGrid.innerHTML = "";


    userNFTs.forEach(function(nft) {

        const card =
            document.createElement("article");

        card.className =
            "nft-card";


        /* IMAGE */

        const image =
            document.createElement("img");

        image.src =
            nft.image || "";

        image.alt =
            nft.name || "Alberto NFT";

        image.loading =
            "lazy";


        image.onerror =
            function() {

                this.style.display =
                    "none";

            };


        const imageBox =
            document.createElement("div");

        imageBox.className =
            "nft-image";

        imageBox.appendChild(
            image
        );


        /* INFO */

        const info =
            document.createElement("div");

        info.className =
            "nft-info";


        const type =
            document.createElement("div");

        type.className =
            "nft-type";

        type.textContent =
            nft.collection ||
            "Alberto Collection";


        const title =
            document.createElement("h3");

        title.textContent =
            nft.name ||
            "Unnamed NFT";


        const meta =
            document.createElement("div");

        meta.className =
            "nft-meta";


        meta.innerHTML = `
            <div>Rarity:
                <strong>${escapeHTML(nft.rarity || "Common")}</strong>
            </div>

            <div>Category:
                <strong>${escapeHTML(nft.category || "Art")}</strong>
            </div>

            <div>Level:
                <strong>${escapeHTML(String(nft.level || 1))}</strong>
            </div>
        `;


        const price =
            document.createElement("div");

        price.className =
            "nft-price";

        price.textContent =
            (Number(nft.price) || 0)
            .toFixed(2) +
            " Pi";


        const status =
            document.createElement("div");

        status.className =
            "nft-status";

        status.textContent =
            "✓ " +
            (nft.status || "Sandbox Minted");


        info.appendChild(type);
        info.appendChild(title);
        info.appendChild(meta);
        info.appendChild(price);
        info.appendChild(status);

        card.appendChild(imageBox);
        card.appendChild(info);

        nftGrid.appendChild(card);

    });

}


/* =========================================================
   SAFE HTML TEXT
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   PROFILE PICTURE
========================================================= */

const profileImage =
    document.getElementById("profileImage");

const profilePictureInput =
    document.getElementById("profilePictureInput");

const profilePictureStatus =
    document.getElementById("profilePictureStatus");


const PROFILE_DB_NAME =
    "AlbertoNFTProfileDB";

const PROFILE_DB_VERSION =
    1;

const PROFILE_STORE_NAME =
    "profiles";


function openProfileDB() {

    return new Promise(
        function(resolve,reject) {

            const request =
                indexedDB.open(
                    PROFILE_DB_NAME,
                    PROFILE_DB_VERSION
                );

            request.onupgradeneeded =
                function(event) {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames.contains(
                            PROFILE_STORE_NAME
                        )
                    ) {

                        db.createObjectStore(
                            PROFILE_STORE_NAME,
                            {
                                keyPath:"username"
                            }
                        );

                    }

                };

            request.onsuccess =
                function(event) {

                    resolve(
                        event.target.result
                    );

                };

            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function saveProfilePicture(
    usernameValue,
    imageData
) {

    const db =
        await openProfileDB();

    return new Promise(
        function(resolve,reject) {

            const transaction =
                db.transaction(
                    PROFILE_STORE_NAME,
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    PROFILE_STORE_NAME
                );

            store.put({

                username:
                    usernameValue,

                image:
                    imageData,

                updatedAt:
                    new Date().toISOString()

            });

            transaction.oncomplete =
                function() {

                    db.close();
                    resolve();

                };

            transaction.onerror =
                function() {

                    db.close();

                    reject(
                        transaction.error
                    );

                };

        }
    );

}


async function loadProfilePicture(
    usernameValue
) {

    const db =
        await openProfileDB();

    return new Promise(
        function(resolve,reject) {

            const transaction =
                db.transaction(
                    PROFILE_STORE_NAME,
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    PROFILE_STORE_NAME
                );

            const request =
                store.get(usernameValue);

            request.onsuccess =
                function() {

                    db.close();

                    resolve(
                        request.result || null
                    );

                };

            request.onerror =
                function() {

                    db.close();

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function loadMyProfilePicture() {

    if (!savedUser) {

        profilePictureStatus.textContent =
            "Connect your Pi account first.";

        return;

    }

    try {

        const savedProfile =
            await loadProfilePicture(
                savedUser
            );

        if (
            savedProfile &&
            savedProfile.image
        ) {

            profileImage.src =
                savedProfile.image;

            profilePictureStatus.textContent =
                "✓ Profile picture saved";

        } else {

            profilePictureStatus.textContent =
                "No profile picture yet";

        }

    } catch (error) {

        console.error(
            "Profile picture error:",
            error
        );

        profilePictureStatus.textContent =
            "Unable to load profile picture.";

    }

}


profilePictureInput.addEventListener(
    "change",
    async function() {

        const file =
            this.files[0];

        if (!file) {
            return;
        }

        if (
            !file.type ||
            !file.type.startsWith("image/")
        ) {

            profilePictureStatus.textContent =
                "Please select a valid image.";

            this.value = "";

            return;

        }

        if (
            file.size >
            5 * 1024 * 1024
        ) {

            profilePictureStatus.textContent =
                "Image must be smaller than 5 MB.";

            this.value = "";

            return;

        }

        if (!savedUser) {

            profilePictureStatus.textContent =
                "Please connect your Pi account first.";

            this.value = "";

            return;

        }

        try {

            profilePictureStatus.textContent =
                "Saving profile picture...";

            const reader =
                new FileReader();

            reader.onload =
                async function(event) {

                    try {

                        const imageData =
                            event.target.result;

                        await saveProfilePicture(
                            savedUser,
                            imageData
                        );

                        profileImage.src =
                            imageData;

                        profilePictureStatus.textContent =
                            "✓ Profile picture saved successfully!";

                    } catch(error) {

                        console.error(error);

                        profilePictureStatus.textContent =
                            "Failed to save profile picture.";

                    }

                };

            reader.onerror =
                function() {

                    profilePictureStatus.textContent =
                        "Unable to read image.";

                };

            reader.readAsDataURL(file);

        } catch(error) {

            console.error(error);

            profilePictureStatus.textContent =
                "Failed to process image.";

        }

    }
);


/* =========================================================
   START
========================================================= */

loadNFTCollection();

loadMyProfilePicture();

</script>

</body>
</html>
