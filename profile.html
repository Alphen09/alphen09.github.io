<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alberto NFT Marketplace - Profile</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #35145f 0%,
                    #1a0b31 40%,
                    #09050f 100%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            padding: 20px;
        }


        .container {
            width: 100%;
            max-width: 600px;

            margin: 0 auto;

            padding-top: 25px;
        }


        /* HEADER */

        .top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 30px;
        }


        .back-btn {
            padding: 11px 16px;

            border-radius: 12px;

            border: 1px solid
                rgba(170,100,255,.4);

            background:
                rgba(25,12,43,.9);

            color: white;

            font-size: 14px;

            cursor: pointer;
        }


        .title {
            font-size: 20px;

            font-weight: bold;
        }


        /* PROFILE CARD */

        .profile-card {
            padding: 35px 25px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(35,20,52,.98),
                    rgba(12,8,18,.98)
                );

            border:
                1px solid
                rgba(170,100,255,.3);

            border-radius: 24px;

            box-shadow:
                0 15px 45px
                rgba(0,0,0,.45);
        }


        .avatar {
            width: 105px;
            height: 105px;

            margin: 0 auto 20px;

            border-radius: 50%;

            overflow: hidden;

            border:
                2px solid
                rgba(180,110,255,.7);

            box-shadow:
                0 0 30px
                rgba(130,60,230,.4);
        }


        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        .profile-card h1 {
            font-size: 28px;

            margin-bottom: 8px;
        }


        .username {
            color: #c49aff;

            font-size: 16px;

            margin-bottom: 25px;
        }


        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 25px;
        }


        .stat {
            padding: 15px 8px;

            border-radius: 14px;

            background:
                rgba(15,9,24,.8);

            border:
                1px solid
                rgba(150,90,220,.2);
        }


        .stat strong {
            display: block;

            font-size: 20px;

            color: #d5b4ff;

            margin-bottom: 5px;
        }


        .stat span {
            color: #8f8798;

            font-size: 11px;
        }


        /* ACTIONS */

        .actions {
            margin-top: 25px;
        }


        .market-btn {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #7138c8,
                    #a653f0
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .market-btn:hover {
            transform: translateY(-2px);
        }


        .status {
            margin-top: 25px;

            color: #77717d;

            font-size: 12px;
        }


        /* MOBILE */

        @media (max-width: 420px) {

            .profile-card {
                padding: 30px 18px;
            }

            .title {
                font-size: 17px;
            }

            .profile-card h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- TOP -->

    <div class="top">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back
        </button>

        <div class="title">
            Alberto Profile
        </div>

        <div style="width:60px;"></div>

    </div>


    <!-- PROFILE -->

    <div class="profile-card">


        <div class="avatar">

            <img
                src="alberto%20nft%20marketplace.jpg"
                alt="Alberto NFT Marketplace"
            >

        </div>


        <h1>
            Alberto Collector
        </h1>


        <div
            class="username"
            id="username"
        >
            Loading Pi username...
        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <strong>0</strong>

                <span>
                    NFTs Owned
                </span>

            </div>


            <div class="stat">

                <strong>0</strong>

                <span>
                    NFTs Minted
                </span>

            </div>


            <div class="stat">

                <strong>0 Pi</strong>

                <span>
                    Volume
                </span>

            </div>

        </div>


        <div class="actions">

            <button
                class="market-btn"
                onclick="goMarketplace()"
            >
                🏪 Back to Marketplace
            </button>

        </div>


        <div class="status">
            Alberto NFT Marketplace • Pi Sandbox
        </div>


    </div>


</div>


<script>

    /* =========================
       LOAD PI USER
    ========================= */

    const savedUser =
        localStorage.getItem("piUser");


    const username =
        document.getElementById("username");


    if (savedUser) {

        username.innerHTML =
            "👤 @" + savedUser;

    } else {

        username.innerHTML =
            "👤 Pi account not connected";

    }


    /* =========================
       NAVIGATION
    ========================= */

    function goMarketplace() {

        window.location.href =
            "marketplace.html";

    }


    function goBack() {

        window.location.href =
            "marketplace.html";

    }

</script>


</body>

</html>
